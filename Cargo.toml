[package]
name = "crustify-prim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Marius Momeu <marius.momeu@berkeley.edu>", "The Crustify Contributors"]
license = "MIT OR Apache-2.0"
description = "Generic smart pointers and traits for building safe Rust wrappers over C types"
repository = "https://github.com/crustify-rs/crustify-prim"
documentation = "https://docs.rs/crustify-prim"
homepage = "https://github.com/crustify-rs/crustify-prim"
readme = "README.md"
keywords = ["ffi", "smart-pointer", "raii", "refcount", "c-interop"]
categories = ["api-bindings", "rust-patterns", "no-std", "memory-management"]

[features]
default = ["std"]
# Selects `std::process::abort` for the unrecoverable-failure path; without it
# that path is a double-panic. Nothing in the crate needs `alloc`.
std = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
